<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe7fa"/>
      <stop offset="100%" stop-color="#a4d1f2"/>
    </linearGradient>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82c4"/>
      <stop offset="100%" stop-color="#245f94"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67aee8"/>
      <stop offset="100%" stop-color="#3d8ecf"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#143654" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo Circular com borda suave -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.6"/>

  <!-- Pasta Classica estilo Caja MATE -->
  <g filter="url(#shadow)">
    <!-- Aba Traseira da Pasta -->
    <path d="M96 160 C96 146 108 134 122 134 L214 134 L254 174 L390 174 C404 174 416 186 416 200 L416 340 C416 354 404 366 390 366 L122 366 C108 366 96 354 96 340 Z" fill="url(#folderBack)"/>
    
    <!-- Folha interna de documento -->
    <rect x="130" y="160" width="252" height="150" rx="10" fill="#ffffff" opacity="0.9"/>
    <line x1="160" y1="200" x2="300" y2="200" stroke="#a2c4e2" stroke-width="8" stroke-linecap="round"/>
    <line x1="160" y1="230" x2="260" y2="230" stroke="#a2c4e2" stroke-width="8" stroke-linecap="round"/>

    <!-- Aba Frontal da Pasta -->
    <path d="M84 216 C84 204 94 194 106 194 L406 194 C418 194 428 204 428 216 L416 372 C415 384 405 394 393 394 L119 394 C107 394 97 384 96 372 Z" fill="url(#folderFront)"/>
    <path d="M106 198 L406 198" stroke="#ffffff" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  </g>
</svg>
